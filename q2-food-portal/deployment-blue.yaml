apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-blue
  labels:
    app: food-portal
    version: blue
spec:
  replicas: 3
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 60
  minReadySeconds: 3
  selector:
    matchLabels:
      app: food-portal
      version: blue
  template:
    metadata:
      labels:
        app: food-portal
        version: blue
    spec:
      containers:
        - name: food-portal
          image: muktamotwani/food-portal:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
