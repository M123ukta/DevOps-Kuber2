# Blue-green Deployment template (3 replicas).
# Applied as-is it creates the first colour. The Jenkins pipeline renders a copy
# for whichever colour is idle (swapping the colour name) and sets the image tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-blue
  labels:
    app: food-portal
    version: blue
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: food-portal
      version: blue
  template:
    metadata:
      labels:
        app: food-portal
        version: blue
    spec:
      containers:
        - name: food-portal
          image: muktamotwani/food-portal:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi