apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-portal
  labels:
    app: lms-portal

spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  minReadySeconds: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: lms-portal

  template:
    metadata:
      labels:
        app: lms-portal

    spec:
      containers:
        - name: lms-portal
          image: muktamotwani/lms-portal:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              name: http

          # Detects a faulty release when health.html is missing.
          readinessProbe:
            httpGet:
              path: /health.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1

          # Restarts the container if Nginx itself stops responding.
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
