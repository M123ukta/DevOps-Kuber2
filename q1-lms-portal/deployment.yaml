apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-portal
  labels:
    app: lms-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5          # keep old ReplicaSets so "rollout undo" works
  progressDeadlineSeconds: 60      # rollout is marked failed if not ready in 60s
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0            # old pods keep serving until new ones are Ready
  selector:
    matchLabels:
      app: lms-portal
  template:
    metadata:
      labels:
        app: lms-portal
    spec:
      containers:
        - name: lms-portal
          image: YOUR_DOCKERHUB_USERNAME/lms-portal:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:          # health check used to detect a faulty release
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
